<svg xmlns="http://www.w3.org/2000/svg" width="488" height="480" viewBox="0 0 122 120">
<!-- Source of lib/Assets/ImageOutOfService.png (122x120). Render with: qlmanage -t -s 976 -o . ImageOutOfService.svg, then crop to 976x960, scale to 122x120 and round the corners (radius 15) to transparent. -->
